# Return the account to ~$0: destroy the cluster stack, then aws-nuke everything that
# cleanup/aws-nuke.yaml does not protect (see cleanup/README.md).
#
#   Actions -> nuke -> Run workflow (branch: main)
#     mode: plan  -> dry run only, output in the job log
#     mode: run   -> dry run, then the real nuke; requires confirm = "nuke <account id>"
name: nuke

on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [plan, run]
        default: plan
      confirm:
        description: 'For mode=run type exactly: nuke <AWS account id>'
        type: string
        required: false

concurrency:
  group: aws-testing-cluster
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  plan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: ./.github/actions/aws-login
        with:
          role-arn: ${{ secrets.AWS_ROLE_ARN }}
          account-id: ${{ secrets.AWS_ACCOUNT_ID }}
      # Output stays in the job log only (account id masked). Public repo: no artifact or
      # summary with the resource inventory. For the full picture run cleanup/cleanup.sh plan locally.
      - name: aws-nuke dry run
        env:
          EXPECTED_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
        run: cleanup/cleanup.sh plan

  run:
    needs: plan
    if: inputs.mode == 'run' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 90 # < 2h role session
    steps:
      - name: Confirmation
        env:
          CONFIRM: ${{ inputs.confirm }}
          EXPECTED: nuke ${{ secrets.AWS_ACCOUNT_ID }}
        run: |
          if [ "$CONFIRM" != "$EXPECTED" ]; then
            echo "::error::Refusing to nuke: confirm input must be exactly '$EXPECTED'."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: ./.github/actions/aws-login
        with:
          role-arn: ${{ secrets.AWS_ROLE_ARN }}
          account-id: ${{ secrets.AWS_ACCOUNT_ID }}
          duration-seconds: "7200"
      - name: aws-nuke
        env:
          EXPECTED_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          CONFIRM_NUKE: "yes"
        run: cleanup/cleanup.sh run
